<!DOCTYPE html>
<html lang="en">
<head>
  <title>Club Membership</title>

  <style>

    input {
      width: 100%;
      padding: 5px;
      margin: 5px 5px 5px 0px;
      box-sizing: border-box;

    }

  </style>

</head>
<body>

<h1>Student Club Roster</h1>

<h2>Add Students</h2>

<label for="student-name">Student Name</label><input id="student-name" name="student-name">
<br>
<label for="student-id">Student ID</label><input id="student-id" name="student-id">
<br>
<label for="student-gpa">Student GPA</label><input id="student-gpa" name="student-gpa" type="number">
<br>
<button id="add-student">Add Student</button>


<h2>Student List</h2>

<p>There are
  <span id="student-count">
          <!-- use JavaScript to count the number of students, and show here -->
        </span>
  student(s) in the club.</p>

<ul id="student-list">
  <!-- use JavaScript to create li elements  -->
</ul>




<script>
let addStudent = document.querySelector ("#add-student")

let StudentGPA = document.querySelector ("#student-gpa")

let StudentID = document.querySelector ("#student-id")

let StudentName = document.querySelector ("#student-name")

let Studentlist = document.querySelector ("#student-list")

let StudentCount = document.querySelector ("#student-count")

// show 0
StudentCount.innerHTML = 0

addStudent.addEventListener('click', function() { 
    
    // name read
    let studentNameText = StudentName.value
    if (studentNameText === "") {
        alert("Please enter a student name.")
        return
    }

    //ID read
    let studentIdText = StudentID.value
    if (studentIdText === "") {
        alert("Please enter a student ID.")
        return
    }

    // GPA read
    let studentGPAText = StudentGPA.value 
    if (studentGPAText === "" || studentGPAText < 0 || studentGPAText > 4) {
        alert("Please enter a GPA between 0 and 4.")
        return
    } 



    // add gpa and id 

    let newListElement = document.createElement('li')
    newListElement.innerHTML = `${studentNameText}, id: ${studentIdText}, GPA ${studentGPAText}`
    Studentlist.appendChild(newListElement)




    StudentName.value = ""
    StudentID.value = ""
    StudentGPA.value = ""
    StudentCount.innerHTML = Studentlist.children.length
})





</script>

</body>
</html>
