<!DOCTYPE html>
<html lang="en">
<head>
  <title>Conference Registration</title>

  <!-- bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- google font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins&display=swap" rel="stylesheet">

  <style>
    /* use the google font on the whole page */
    body {
      font-family: 'Poppins', sans-serif;
    }
  </style>
</head>
<body>

<h1>Conference Registration</h1>

<form>

  <label for="name">Name</label>
  <input type="text" id="name" name="name" class="form-control" maxlength="70" required>
  <br>

  <label for="password">Password</label>
  <input type="password" id="password" name="password" class="form-control" required>
  <br>

  <label for="email">Email</label>
  <input type="email" id="email" name="email" class="form-control" required>
  <br>

  <label for="tshirt">T-Shirt Size</label>
  <select id="tshirt" name="tshirt" class="form-select" required>
    <option value="" disabled selected>Select a size</option>
    <option value="small">Small</option>
    <option value="medium">Medium</option>
    <option value="large">Large</option>
  </select>
  <br>

  <label for="dob">Date of Birth</label>
  <input type="date" id="dob" name="dob" class="form-control" required>
  <br>

  <!-- same name makes the radio buttons work together -->
  <p>Receive email updates from conference sponsors?</p>
  <input type="radio" id="updates-yes" name="updates" value="yes" class="form-check-input" required>
  <label for="updates-yes">Yes</label>
  <input type="radio" id="updates-no" name="updates" value="no" class="form-check-input" required>
  <label for="updates-no">No</label>
  <br>
  <br>

  <p>Choose sessions</p>
  <input type="checkbox" id="morning" name="morning" value="morning" class="form-check-input">
  <label for="morning">Morning session</label>
  <input type="checkbox" id="afternoon" name="afternoon" value="afternoon" class="form-check-input">
  <label for="afternoon">Afternoon session</label>
  <br>
  <br>

  <label for="requests">Special Requests</label>
  <textarea id="requests" name="requests" class="form-control" rows="7" cols="70"></textarea>
  <br>

  <!-- no type=submit, javascript handles the click -->
  <button type="button" id="submit-button" class="btn btn-primary">Submit</button>

</form>

<script>

  let nameInput = document.querySelector('#name')
  let passwordInput = document.querySelector('#password')
  let emailInput = document.querySelector('#email')
  let tshirtSelect = document.querySelector('#tshirt')
  let dobInput = document.querySelector('#dob')
  let updatesYes = document.querySelector('#updates-yes')
  let updatesNo = document.querySelector('#updates-no')
  let morningCheckbox = document.querySelector('#morning')
  let afternoonCheckbox = document.querySelector('#afternoon')
  let requestsTextarea = document.querySelector('#requests')

  let submitButton = document.querySelector('#submit-button')

  submitButton.addEventListener('click', function() {

    // read the values
    let name = nameInput.value
    let password = passwordInput.value
    let email = emailInput.value
    let tShirtSize = tshirtSelect.value
    let dateOfBirth = dobInput.value
    let specialRequests = requestsTextarea.value

    let errors = []

    // check everything (except special requests) is filled in
    if (name === "") {
      errors.push("Please enter your name.")
    }

    if (password === "") {
      errors.push("Please enter a password.")
    }

    if (email === "") {
      errors.push("Please enter your email.")
    }

    if (tShirtSize === "") {
      errors.push("Please select a t-shirt size.")
    }

    if (dateOfBirth === "") {
      errors.push("Please enter your date of birth.")
    }

    // one of the radio buttons has to be picked
    if (updatesYes.checked === false && updatesNo.checked === false) {
      errors.push("Please choose yes or no for email updates.")
    }

    // at least one session has to be checked
    if (morningCheckbox.checked === false && afternoonCheckbox.checked === false) {
      errors.push("Please choose at least one session.")
    }

    // if there are errors, show them and stop
    if (errors.length > 0) {
      alert(errors.join("\n"))
      return
    }

    // true if yes is picked, false if no
    let receiveEmailUpdates = updatesYes.checked

    // add the sessions they picked to an array
    let sessionsAttended = []

    if (morningCheckbox.checked) {
      sessionsAttended.push("morning")
    }

    if (afternoonCheckbox.checked) {
      sessionsAttended.push("afternoon")
    }

    // make the registration object
    let registration = {
      name: name,
      password: password,
      email: email,
      tShirtSize: tShirtSize,
      dateOfBirth: dateOfBirth,
      receiveEmailUpdates: receiveEmailUpdates,
      sessionsAttended: sessionsAttended,
      specialRequests: specialRequests
    }

    console.log(registration)
  })

</script>

</body>
</html>
